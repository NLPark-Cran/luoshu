name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: "" # host target (x86_64-pc-windows-msvc)
          - platform: ubuntu-22.04
            target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install frontend (none — shell/ is zero-build)
        run: echo "shell/ is plain HTML/CSS/JS, nothing to build"

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/luoshu-bridge\nsrc-tauri"

      - name: install Linux GUI dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libxcb1-dev libxcb-randr0-dev patchelf

      - name: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag pushes create a GitHub Release with the bundles attached;
          # workflow_dispatch runs only upload workflow artifacts (below).
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: upload artifacts (all builds)
        uses: actions/upload-artifact@v4
        with:
          name: luoshu-${{ matrix.platform }}${{ matrix.target && format('-{0}', matrix.target) || '' }}
          path: |
            target/release/bundle/**
            target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: warn
