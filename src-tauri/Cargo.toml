[package]
name = "luoshu"
description = "Luoshu — local companion client for Cran Code (Tauri shell + device bridge)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "luoshu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multi-webview (Window::add_child / get_webview), which the
# toolbar-over-content layout relies on.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
luoshu-bridge = { path = "../crates/luoshu-bridge" }

[features]
# Compile without the GUI-dependent parts? The Tauri app itself always needs
# the GUI toolchain; the bridge crate tests headless independently.
default = []
